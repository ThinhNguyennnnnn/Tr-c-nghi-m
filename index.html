<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Trắc Nghiệm An Ninh Mạng Song Ngữ - 82 Câu Hỏi</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --card-hover: #1e293b;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-accent: #38bdf8;
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --font-code: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .quiz-app {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .app-title-box h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .app-title-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .stat-pill span {
      color: var(--primary-accent);
      font-weight: 800;
    }

    .btn-shuffle-head {
      background: rgba(56, 189, 248, 0.12);
      border: 1.5px solid var(--primary-accent);
      color: var(--primary-accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-shuffle-head:hover {
      background: var(--primary-accent);
      color: #0b1120;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 20px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .nav-drawer {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-toggle-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .drawer-toggle-btn:hover {
      color: var(--text-main);
    }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
      padding-top: 8px;
    }

    .q-dot {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .q-dot:hover {
      border-color: var(--primary-accent);
      color: #fff;
    }

    .q-dot.active {
      border-color: var(--primary-accent);
      background: rgba(56, 189, 248, 0.15);
      color: #fff;
    }

    .q-dot.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
    }

    .q-dot.incorrect {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .question-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .q-type-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary-accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .q-header-box {
      margin-bottom: 22px;
    }

    .q-title-en {
      font-size: 1.06rem;
      line-height: 1.6;
      font-weight: 600;
      color: #f3f4f6;
      white-space: pre-line;
    }

    .q-title-vi {
      font-size: 0.9rem;
      line-height: 1.5;
      font-weight: 400;
      color: #94a3b8;
      margin-top: 8px;
      padding-left: 12px;
      border-left: 3px solid #38bdf8;
      white-space: pre-line;
    }

    pre.code-block {
      font-family: var(--font-code);
      background: #0b1120;
      border: 1px solid #1e293b;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.88rem;
      color: #38bdf8;
      overflow-x: auto;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .option-item {
      display: flex;
      align-items: flex-start;
      padding: 12px 16px;
      background: #0b1120;
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .option-item:hover:not(.locked) {
      background: var(--card-hover);
      border-color: #3b82f6;
      transform: translateX(4px);
    }

    .opt-letter {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: #1e293b;
      border: 1px solid #334155;
      font-weight: 700;
      font-size: 0.82rem;
      margin-right: 14px;
      color: var(--primary-accent);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .opt-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .opt-en {
      font-size: 0.93rem;
      color: #e2e8f0;
      font-weight: 500;
      line-height: 1.45;
    }

    .opt-vi {
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 400;
      line-height: 1.4;
    }

    .option-item.selected {
      border-color: var(--primary-accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .option-item.selected .opt-letter {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .option-item.correct {
      background: var(--success-soft) !important;
      border-color: var(--success) !important;
    }
    .option-item.correct .opt-en { color: #ecfdf5 !important; }
    .option-item.correct .opt-vi { color: #a7f3d0 !important; }
    .option-item.correct .opt-letter {
      background: var(--success) !important;
      color: #fff !important;
      border-color: var(--success) !important;
    }

    .option-item.wrong {
      background: var(--danger-soft) !important;
      border-color: var(--danger) !important;
    }
    .option-item.wrong .opt-en { color: #fef2f2 !important; }
    .option-item.wrong .opt-vi { color: #fecaca !important; }
    .option-item.wrong .opt-letter {
      background: var(--danger) !important;
      color: #fff !important;
      border-color: var(--danger) !important;
    }

    .option-item.locked {
      cursor: default;
    }

    .quiz-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-secondary {
      background: #1f293d;
      color: #cbd5e1;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #334155;
      color: #fff;
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      color: #fff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .summary-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .summary-score-dial {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--primary-accent);
      background: radial-gradient(circle, #1e293b, #0b1120);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
    }

    .summary-score-dial .score-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
    }

    .summary-score-dial .score-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .summary-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .summary-desc {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 520px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }

    .summary-breakdown {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .breakdown-item {
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 22px;
    }

    .breakdown-val {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .breakdown-val.pass { color: var(--success); }
    .breakdown-val.fail { color: var(--danger); }
    .breakdown-val.pct { color: var(--primary-accent); }

    .breakdown-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    .summary-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) {
      .quiz-card { padding: 22px 18px; }
      .app-header { flex-direction: column; align-items: flex-start; }
      .header-stats { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <div class="quiz-app">
    <header class="app-header">
      <div class="app-title-box">
        <h1>Canvas Ôn Tập An Ninh Mạng (Song Ngữ)</h1>
        <p>Hỗ trợ dịch tiếng Việt kèm tính năng xáo trộn câu hỏi</p>
      </div>
      <div class="header-stats">
        <button class="btn-shuffle-head" onclick="triggerManualShuffle()">🔀 Trộn câu hỏi</button>
        <div class="stat-pill">Điểm: <span id="stat-score">0</span></div>
        <div class="stat-pill">Đúng: <span id="stat-correct">0/82</span></div>
      </div>
    </header>

    <div class="progress-card">
      <div class="progress-meta">
        <span id="label-progress-step">Câu 1 trên 82</span>
        <span id="label-progress-pct">0% hoàn thành</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="nav-drawer">
      <button class="drawer-toggle-btn" onclick="toggleNavGrid()">
        <span>Mục lục câu hỏi (Nhấp để mở rộng / thu gọn)</span>
        <span id="nav-arrow">▼</span>
      </button>
      <div class="question-grid" id="question-grid"></div>
    </div>

    <main class="quiz-card" id="quiz-canvas">
      <div>
        <div class="question-meta">
          <span class="q-type-badge" id="badge-question-type">Chọn 1 đáp án</span>
          <span class="q-type-badge" id="badge-question-index">Câu #1</span>
        </div>
        <div class="q-header-box">
          <div class="q-title-en" id="q-en"></div>
          <div class="q-title-vi" id="q-vi"></div>
        </div>
        <div class="options-grid" id="options-box"></div>
      </div>

      <div class="quiz-actions">
        <button class="btn btn-secondary" id="btn-prev" onclick="goToPrevQuestion()">← Câu trước</button>
        <button class="btn btn-primary" id="btn-submit-multi" onclick="submitMultiAnswer()" style="display:none;">Xác nhận đáp án</button>
        <button class="btn btn-primary" id="btn-next" onclick="goToNextQuestion()">Câu tiếp theo →</button>
      </div>
    </main>

    <div class="summary-card" id="summary-view">
      <div class="summary-score-dial">
        <div class="score-value" id="summary-percentage">0%</div>
        <div class="score-label">Tỷ Lệ Đạt</div>
      </div>
      <h2 class="summary-title" id="summary-title">Đã hoàn thành 82 câu!</h2>
      <p class="summary-desc" id="summary-comment">Nhận xét kết quả của bạn.</p>

      <div class="summary-breakdown">
        <div class="breakdown-item">
          <div class="breakdown-val pass" id="summary-correct">0</div>
          <div class="breakdown-lbl">CÂU ĐÚNG</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-val fail" id="summary-incorrect">0</div>
          <div class="breakdown-lbl">CÂU SAI</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-val pct" id="summary-total-score">0</div>
          <div class="breakdown-lbl">TỔNG ĐIỂM</div>
        </div>
      </div>

      <div class="summary-actions">
        <button class="btn btn-secondary" onclick="restartQuiz(false)">Làm lại (Giữ thứ tự)</button>
        <button class="btn btn-primary" onclick="restartQuiz(true)">🔀 Trộn đề & Làm lại</button>
      </div>
    </div>
  </div>

  <script>
    // Dữ liệu song ngữ đầy đủ 82 câu hỏi
    const rawQuizDataset = [
      {
        q: "As part of a new industry regulation, companies are required to utilize secure, standardized OS settings. A technician must ensure the OS settings are hardened.\nWhich of the following is the BEST way to do this?",
        q_vi: "Theo quy định mới của ngành, các công ty phải áp dụng các thiết lập hệ điều hành an toàn và chuẩn hóa. Kỹ thuật viên phải đảm bảo các thiết lập HĐH được 'làm cứng' (hardened).\nCách tốt nhất để thực hiện là gì?",
        opts: [
          { en: "Use a vulnerability scanner.", vi: "Sử dụng trình quét lỗ hổng bảo mật." },
          { en: "Use a configuration compliance scanner.", vi: "Sử dụng trình quét tuân thủ cấu hình chuẩn." },
          { en: "Use a passive, in-line scanner.", vi: "Sử dụng trình quét thụ động dạng in-line." },
          { en: "Use a protocol analyzer.", vi: "Sử dụng bộ phân tích giao thức (packet analyzer)." }
        ],
        ans: [1]
      },
      {
        q: "A security analyst is hardening a web server, which should allow a secure certificate-based session using the organization's PKI infrastructure. The web server should also utilize the latest security techniques and standards. Given this set of requirements, which of the following techniques should the analyst implement to BEST meet these requirements? (Choose two.)",
        q_vi: "Chuyên viên phân tích đang làm cứng web server để cho phép phiên làm việc an toàn dựa trên chứng chỉ thuộc PKI của tổ chức và dùng các tiêu chuẩn mới nhất. Kỹ thuật nào nên triển khai? (Chọn 2 đáp án)",
        opts: [
          { en: "Install an X-509-compliant certificate.", vi: "Cài đặt chứng chỉ số chuẩn X.509." },
          { en: "Implement a CRL using an authorized CA.", vi: "Triển khai danh sách thu hồi chứng chỉ (CRL) từ CA ủy quyền." },
          { en: "Enable and configure TLS on the server.", vi: "Kích hoạt và cấu hình TLS trên máy chủ." },
          { en: "Install a certificate signed by a public CA.", vi: "Cài chứng chỉ do CA công cộng ký." },
          { en: "Configure the web server to use a host header", vi: "Cấu hình máy chủ web dùng host header." }
        ],
        ans: [0, 2]
      },
      {
        q: "A security administrator has been assigned to review the security posture of the standard corporate system image for virtual machines. The review reveals several accounts that will not be used in production.\nWhich of the following would correct the deficiencies?",
        q_vi: "Quản trị viên rà soát bản sao hệ điều hành chuẩn (image) cho máy ảo và nhận thấy có nhiều tài khoản không sử dụng trong môi trường thực tế.\nBiện pháp nào khắc phục vấn đề này?",
        opts: [
          { en: "Mandatory access controls", vi: "Kiểm soát truy cập bắt buộc (MAC)." },
          { en: "Disable remote login", vi: "Vô hiệu hóa đăng nhập từ xa." },
          { en: "Host hardening", vi: "Làm cứng máy chủ (vô hiệu hóa tài khoản thừa, dịch vụ thừa)." },
          { en: "Disabling services", vi: "Vô hiệu hóa các dịch vụ." }
        ],
        ans: [2]
      },
      {
        q: "Task ghép cổng (port) mặc định với dịch vụ tương ứng:\nFTP ___ | Telnet ___ | SMTP ___ | SNMP ___ | SCP ___ | TFTP ___",
        q_vi: "Ghép đúng cổng mặc định của từng giao thức mạng:",
        opts: [
          { en: "FTP → 21 | Telnet → 23 | SMTP → 25 | SNMP → 161 | SCP → 22 | TFTP → 69", vi: "FTP: 21 | Telnet: 23 | SMTP: 25 | SNMP: 161 | SCP: 22 | TFTP: 69" },
          { en: "FTP → 22 | Telnet → 21 | SMTP → 25 | SNMP → 69 | SCP → 23 | TFTP → 161", vi: "FTP: 22 | Telnet: 21 | SMTP: 25 | SNMP: 69 | SCP: 23 | TFTP: 161" },
          { en: "FTP → 21 | Telnet → 25 | SMTP → 23 | SNMP → 161 | SCP → 69 | TFTP → 22", vi: "FTP: 21 | Telnet: 25 | SMTP: 23 | SNMP: 161 | SCP: 69 | TFTP: 22" },
          { en: "FTP → 23 | Telnet → 21 | SMTP → 25 | SNMP → 22 | SCP → 161 | TFTP → 69", vi: "FTP: 23 | Telnet: 21 | SMTP: 25 | SNMP: 22 | SCP: 161 | TFTP: 69" }
        ],
        ans: [0]
      },
      {
        q: "Ann, a user, states that her machine has been behaving erratically over the past week. She has experienced slowness and input lag and found text files that appear to contain pieces of her emails or online conversations with coworkers. The technician runs a standard virus scan but detects nothing.\nWhich of the following types of malware has infected the machine?",
        q_vi: "Người dùng nhận thấy máy bị giật lag và xuất hiện các file text chứa đoạn hội thoại hoặc email của cô ấy. Quét virus thông thường không thấy gì.\nMáy tính đã bị nhiễm loại mã độc nào?",
        opts: [
          { en: "Ransomware", vi: "Mã độc tống tiền (Ransomware)." },

      const cloned = [...arr];
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

    function triggerManualShuffle() {
      const hasAnsweredAny = userAnswers.some(a => a !== null);
      if (hasAnsweredAny) {
        const confirmShuffle = confirm("Trộn lại câu hỏi sẽ bắt đầu lại lượt làm bài từ câu đầu tiên. Bạn có muốn tiếp tục?");
        if (!confirmShuffle) return;
      }
      restartQuiz(true);
    }

    function initNavigator() {
      questionGrid.innerHTML = "";
      activeDataset.forEach((_, idx) => {
        const dot = document.createElement("div");
        dot.className = "q-dot";
        dot.id = `q-dot-${idx}`;
        dot.textContent = idx + 1;
        dot.onclick = () => jumpToQuestion(idx);
        questionGrid.appendChild(dot);
      });
    }

    function toggleNavGrid() {
      const isHidden = questionGrid.style.display === "none";
      questionGrid.style.display = isHidden ? "grid" : "none";
      document.getElementById("nav-arrow").textContent = isHidden ? "▼" : "▲";
    }

    function renderQuestion(index) {
      currentIndex = index;
      const data = activeDataset[index];
      const isMulti = data.ans.length > 1;
      const answered = userAnswers[index] !== null;

      qIndexBadge.textContent = `Câu #${index + 1} / ${activeDataset.length}`;
      qTypeBadge.textContent = isMulti ? `Chọn ${data.ans.length} đáp án` : "Chọn 1 đáp án";

      qEnEl.innerHTML = data.q;
      qViEl.innerHTML = data.q_vi;

      multiTempSelection = answered ? [...userAnswers[index]] : [];
      optionsBoxEl.innerHTML = "";

      data.opts.forEach((opt, optIdx) => {
        const optDiv = document.createElement("div");
        optDiv.className = "option-item";
        optDiv.innerHTML = `
          <span class="opt-letter">${alphabet[optIdx]}</span>
          <div class="opt-content">
            <span class="opt-en">${opt.en}</span>
            <span class="opt-vi">${opt.vi}</span>
          </div>
        `;

        if (answered) {
          optDiv.classList.add("locked");
          const isCorrectAnswer = data.ans.includes(optIdx);
          const wasSelected = userAnswers[index].includes(optIdx);

          if (isCorrectAnswer) {
            optDiv.classList.add("correct");
          } else if (wasSelected && !isCorrectAnswer) {
            optDiv.classList.add("wrong");
          }
        } else {
          optDiv.onclick = () => handleSelectOption(optIdx, isMulti, optDiv);
        }

        optionsBoxEl.appendChild(optDiv);
      });

      btnPrev.disabled = index === 0;
      if (isMulti && !answered) {
        btnSubmitMulti.style.display = "inline-flex";
        btnNext.style.display = "none";
      } else {
        btnSubmitMulti.style.display = "none";
        btnNext.style.display = "inline-flex";
        btnNext.textContent = index === activeDataset.length - 1 ? "Xem kết quả 🏁" : "Câu tiếp theo →";
      }

      updateProgressAndStats();
      updateNavHighlight();
    }

    function handleSelectOption(optIdx, isMulti, optDiv) {
      if (!isMulti) {
        userAnswers[currentIndex] = [optIdx];
        renderQuestion(currentIndex);
      } else {
        if (multiTempSelection.includes(optIdx)) {
          multiTempSelection = multiTempSelection.filter(i => i !== optIdx);
          optDiv.classList.remove("selected");
        } else {
          if (multiTempSelection.length < activeDataset[currentIndex].ans.length) {
            multiTempSelection.push(optIdx);
            optDiv.classList.add("selected");
          }
        }
      }
    }

    function submitMultiAnswer() {
      if (multiTempSelection.length === 0) {
        alert("Vui lòng chọn ít nhất một đáp án!");
        return;
      }
      userAnswers[currentIndex] = [...multiTempSelection];
      renderQuestion(currentIndex);
    }

    function updateProgressAndStats() {
      let correctCount = 0;
      let totalAnswered = 0;

      userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
          totalAnswered++;
          const target = activeDataset[idx].ans;
          const isExact = ans.length === target.length && ans.every(v => target.includes(v));
          if (isExact) correctCount++;
        }
      });

      const pct = Math.round((totalAnswered / activeDataset.length) * 100);
      progressBar.style.width = `${pct}%`;
      progressStep.textContent = `Câu ${currentIndex + 1} trên ${activeDataset.length}`;
      progressPct.textContent = `${pct}% hoàn thành`;

      statCorrect.textContent = `${correctCount}/${activeDataset.length}`;
      statScore.textContent = correctCount * 10;
    }

    function updateNavHighlight() {
      activeDataset.forEach((_, idx) => {
        const dot = document.getElementById(`q-dot-${idx}`);
        if (!dot) return;

        dot.className = "q-dot";
        if (idx === currentIndex) dot.classList.add("active");

        if (userAnswers[idx] !== null) {
          const target = activeDataset[idx].ans;
          const isExact = userAnswers[idx].length === target.length && userAnswers[idx].every(v => target.includes(v));
          dot.classList.add(isExact ? "correct" : "incorrect");
        }
      });
    }

    function jumpToQuestion(idx) {
      renderQuestion(idx);
    }

    function goToPrevQuestion() {
      if (currentIndex > 0) renderQuestion(currentIndex - 1);
    }

    function goToNextQuestion() {
      if (currentIndex < activeDataset.length - 1) {
        renderQuestion(currentIndex + 1);
      } else {
        showFinalSummary();
      }
    }

    function showFinalSummary() {
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
          const target = activeDataset[idx].ans;
          const isExact = ans.length === target.length && ans.every(v => target.includes(v));
          if (isExact) correctCount++;
        }
      });

      const total = activeDataset.length;
      const incorrectCount = total - correctCount;
      const percentage = Math.round((correctCount / total) * 100);

      quizCanvas.style.display = "none";
      summaryView.style.display = "block";

      document.getElementById("summary-percentage").textContent = `${percentage}%`;
      document.getElementById("summary-correct").textContent = correctCount;
      document.getElementById("summary-incorrect").textContent = incorrectCount;
      document.getElementById("summary-total-score").textContent = correctCount * 10;

      const titleEl = document.getElementById("summary-title");
      const commentEl = document.getElementById("summary-comment");

      if (percentage >= 85) {
        titleEl.textContent = "Xuất sắc! Đạt chuẩn chuyên gia 🛡️";
        commentEl.textContent = "Bạn nắm rất vững các kỹ năng rà quét, kiểm thử thâm nhập, mật mã học và bảo mật hệ thống mạng!";
      } else if (percentage >= 65) {
        titleEl.textContent = "Kết quả khá tốt! 🚀";
        commentEl.textContent = "Nền tảng của bạn rất ổn định. Hãy xem lại các câu trả lời sai (được tô đỏ trong mục lục) để củng cố kỹ hơn.";
      } else {
        titleEl.textContent = "Cần ôn tập thêm 📚";
        commentEl.textContent = "Hãy rà soát kỹ các kiến thức về giao thức truyền tin an toàn, các dạng tấn công mã độc và cấu hình kiểm soát mạng.";
      }
    }

    function restartQuiz(shouldShuffle = false) {
      if (shouldShuffle) {
        activeDataset = shuffleArray(rawQuizDataset);
      } else {
        activeDataset = [...rawQuizDataset];
      }

      userAnswers = new Array(activeDataset.length).fill(null);
      summaryView.style.display = "none";
      quizCanvas.style.display = "flex";

      initNavigator();
      renderQuestion(0);
    }

    initNavigator();
    renderQuestion(0);
  </script>
</body>
</html>
